
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA

  - name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet pyyaml
        python - <<'PY'
        from pathlib import Path
        import sys
        import yaml

        path = Path("cloudrun.env.yaml")
        print("Validating cloudrun.env.yaml...")

        try:
            text = path.read_text()
            data = yaml.safe_load(text)

            if not isinstance(data, dict):
                raise ValueError(
                    "Expected a YAML mapping using KEY: VALUE syntax."
                )

            print("YAML syntax is valid.")
            print(f"Environment variable count: {len(data)}")

        except Exception as exc:
            print(f"Validation failed: {type(exc).__name__}")

            mark = getattr(exc, "problem_mark", None)
            if mark is None and isinstance(exc, yaml.YAMLError):
                mark = getattr(exc, "context_mark", None)

            if mark is not None:
                line_number = mark.line + 1
                column_number = mark.column + 1
                print(
                    f"Error at line {line_number}, "
                    f"column {column_number}."
                )

                lines = path.read_text().splitlines()
                start = max(0, line_number - 4)
                end = min(len(lines), line_number + 3)

                print("Nearby lines (values redacted):")
                for index in range(start, end):
                    line = lines[index]
                    stripped = line.strip()

                    if not stripped or stripped.startswith("#"):
                        print(f"{index + 1}: [blank/comment]")
                    elif ":" in stripped:
                        key = stripped.split(":", 1)[0].strip()
                        print(f"{index + 1}: {key}: [REDACTED]")
                    else:
                        print(f"{index + 1}: [NON-MAPPING LINE]")
            else:
                print(str(exc))

            sys.exit(1)
        PY

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - healthos-api
      - --image=asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA
      - --project=storied-shell-510407-e0
      - --region=asia-south1
      - --platform=managed
      - --service-account=healthos-cloud-run@storied-shell-510407-e0.iam.gserviceaccount.com
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=10
      - --env-vars-file=cloudrun.env.yaml
      - --set-secrets=SECRET_KEY=healthos-secret-key:latest,ABLY_API_KEY=ABLY_API_KEY:latest,POSTGRES_SYNC_URL=POSTGRES_SYNC_URL:latest,POSTGRES_ASYNC_URL=POSTGRES_ASYNC_URL:latest,ZEPTOMAIL_SEND_TOKEN=ZEPTOMAIL_SEND_TOKEN:latest

  # Keep the durable delivery worker (email/realtime/push outbox) on the same
  # image as the API. The job is created once via scripts/setup_delivery_worker.sh
  # and is triggered every minute by Cloud Scheduler; this step only rolls the image.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        JOB=healthos-delivery-worker
        REGION=asia-south1
        PROJECT=storied-shell-510407-e0
        IMAGE=asia-south1-docker.pkg.dev/$$PROJECT/healthos/healthos-api:$COMMIT_SHA
        if gcloud run jobs describe "$$JOB" --project="$$PROJECT" --region="$$REGION" >/dev/null 2>&1; then
          gcloud run jobs update "$$JOB" --project="$$PROJECT" --region="$$REGION" --image="$$IMAGE"
        else
          echo "Cloud Run job $$JOB not found; run scripts/setup_delivery_worker.sh once to create it."
        fi

images:
  - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
