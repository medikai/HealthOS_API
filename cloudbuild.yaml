
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA

  - name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet pyyaml
        python - <<'PY'
        from pathlib import Path
        import yaml

        path = Path("cloudrun.env.yaml")
        print("Validating cloudrun.env.yaml...")

        try:
            data = yaml.safe_load(path.read_text())
            if not isinstance(data, dict):
                raise ValueError(
                    "Expected a YAML mapping: KEY: VALUE"
                )
            print("YAML syntax is valid.")
            print(f"Environment variable count: {len(data)}")
        except Exception as exc:
            print(f"Configuration validation failed: {type(exc).__name__}")
            if hasattr(exc, "problem_mark") and exc.problem_mark:
                mark = exc.problem_mark
                print(
                    f"Error at line {mark.line + 1}, "
                    f"column {mark.column + 1}"
                )
            elif isinstance(exc, yaml.YAMLError):
                mark = getattr(exc, "problem_mark", None)
                if mark:
                    print(
                        f"Error at line {mark.line + 1}, "
                        f"column {mark.column + 1}"
                    )
            else:
                print(str(exc))
            raise SystemExit(1)
        PY

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - healthos-api
      - --image=asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA
      - --project=storied-shell-510407-e0
      - --region=asia-south1
      - --platform=managed
      - --service-account=healthos-cloud-run@storied-shell-510407-e0.iam.gserviceaccount.com
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=10
      - --env-vars-file=cloudrun.env.yaml
      - --set-secrets=ABLY_API_KEY=ABLY_API_KEY:latest,POSTGRES_SYNC_URL=POSTGRES_SYNC_URL:latest,POSTGRES_ASYNC_URL=POSTGRES_ASYNC_URL:latest

images:
  - asia-south1-docker.pkg.dev/storied-shell-510407-e0/healthos/healthos-api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
